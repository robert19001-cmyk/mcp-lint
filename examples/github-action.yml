name: MCP Schema Lint (example)

# Example workflow showing how to use mcp-lint in CI.
# Copy this to your own repo and adjust the `input` path.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint MCP tool schemas
        # Last published tag. The repo is 0.9.0; use @v0.9.0 after the tag exists.
        uses: robert19001-cmyk/mcp-lint@v0.8.0
        with:
          input: tools.json
          severity: warning
          score: 'true'
          fail_on: error
