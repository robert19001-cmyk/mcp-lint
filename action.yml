name: mcp-lint
description: Lint MCP server tool schemas and score whether tool failures are recoverable
author: robert19001-cmyk

inputs:
  input:
    description: Path to an MCP tools file. When omitted, the action uses the first tools.json, tools.yaml, tools.yml, mcp-tools.json, mcp-tools.yaml, or mcp-tools.yml it finds in the repo root, then one directory down. It skips node_modules and dot directories.
    required: false
    default: ''
  format:
    description: Output format (terminal|json|markdown)
    required: false
    default: terminal
  severity:
    description: Minimum severity to report (error|warning|info)
    required: false
    default: info
  clients:
    description: Comma-separated client filter (claude,cursor,gemini,vscode,windsurf,cline,openai,continue)
    required: false
  fail_on:
    description: Fail the job when a diagnostic is at this severity or above (error|warning|info). warning and info read the full diagnostic list, because the CLI exits 1 only for schema errors.
    required: false
    default: error
  score:
    description: Show quality score (true|false)
    required: false
    default: 'false'
  recover:
    description: Optional path to a recovery JSON file ({ tools, samples })
    required: false
    default: ''
  sarif:
    description: Upload SARIF when the installed mcp-lint supports report (true|false). The workflow needs security-events write.
    required: false
    default: 'false'
  version:
    description: npm dist-tag or version to install. 1 stays on the 1.x line. latest floats. Tag v1.0.0 ignores this input and installs latest.
    required: false
    default: '1'

outputs:
  exit_code:
    description: Exit code from mcp-lint (0 = no errors, 1 = errors found)
    value: ${{ steps.lint.outputs.exit_code }}
  sarif_file:
    description: SARIF path when upload was prepared
    value: ${{ steps.lint.outputs.sarif_file }}

runs:
  using: composite
  steps:
    - name: Install mcp-lint
      shell: bash
      env:
        MCP_LINT_VERSION: ${{ inputs.version }}
      run: |
        case "$MCP_LINT_VERSION" in
          ''|*[!A-Za-z0-9._+-]*)
            echo "version must be an npm dist-tag or version, such as 1, 1.0.0, or latest."
            exit 1
            ;;
        esac
        npm install -g "mcp-lint@${MCP_LINT_VERSION}"

    - name: Run mcp-lint
      id: lint
      shell: bash
      run: |
        INPUT="${{ inputs.input }}"
        if [ -z "$INPUT" ]; then
          for candidate in tools.json tools.yaml tools.yml mcp-tools.json mcp-tools.yaml mcp-tools.yml; do
            if [ -f "$candidate" ]; then
              INPUT="$candidate"
              break
            fi
          done
        fi
        if [ -z "$INPUT" ]; then
          while IFS= read -r candidate; do
            case "$candidate" in
              ./node_modules/*|./.*) continue ;;
            esac
            INPUT="${candidate#./}"
            break
          done < <(find . -mindepth 2 -maxdepth 2 -type f \( -name tools.json -o -name tools.yaml -o -name tools.yml -o -name mcp-tools.json -o -name mcp-tools.yaml -o -name mcp-tools.yml \) ! -path './node_modules/*' ! -path './.*/*' | sort)
        fi
        if [ -z "$INPUT" ]; then
          echo "No tool schema found. Add tools.json or set the input path."
          exit 1
        fi

        DIAGNOSTICS="${RUNNER_TEMP:-/tmp}/mcp-lint-diagnostics.json"
        set +e
        mcp-lint check "$INPUT" --format json --severity info > "$DIAGNOSTICS"
        set -e
        node "${{ github.action_path }}/scripts/github-annotations.mjs" "$INPUT" "$DIAGNOSTICS"

        set -- "$INPUT" --format "${{ inputs.format }}" --severity "${{ inputs.severity }}"
        if [ -n "${{ inputs.clients }}" ]; then
          set -- "$@" --clients "${{ inputs.clients }}"
        fi
        if [ "${{ inputs.score }}" = "true" ]; then
          set -- "$@" --score
        fi

        set +e
        mcp-lint check "$@"
        EXIT_CODE=$?
        if [ -n "${{ inputs.recover }}" ]; then
          mcp-lint recover "${{ inputs.recover }}"
          RECOVER_CODE=$?
          if [ $RECOVER_CODE -gt $EXIT_CODE ]; then
            EXIT_CODE=$RECOVER_CODE
          fi
        fi
        set -e

        FAIL_SEVERITY="${{ inputs.fail_on }}"
        if [ "$EXIT_CODE" -le 1 ]; then
          set +e
          node "${{ github.action_path }}/scripts/github-annotations.mjs" --fail-on "$FAIL_SEVERITY" "$DIAGNOSTICS"
          FAIL_CODE=$?
          set -e
          if [ "$FAIL_CODE" -gt "$EXIT_CODE" ]; then
            EXIT_CODE=$FAIL_CODE
          fi
        fi

        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        if [ "${{ inputs.sarif }}" = "true" ]; then
          if mcp-lint report --help >/dev/null 2>&1; then
            SARIF="${RUNNER_TEMP:-/tmp}/mcp-lint.sarif"
            mcp-lint report "$INPUT" --format sarif --output "$SARIF"
            echo "sarif_file=$SARIF" >> $GITHUB_OUTPUT
          else
            echo "::warning::Installed mcp-lint has no report command, so SARIF was not uploaded."
          fi
        fi

        if [ "$EXIT_CODE" -ne 0 ]; then
          exit "$EXIT_CODE"
        fi

    - name: Upload SARIF
      if: always() && inputs.sarif == 'true' && steps.lint.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.lint.outputs.sarif_file }}
